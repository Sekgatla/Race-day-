services:
  api:
    build:
      context: .
      dockerfile: Part 2/RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RACEDAY_DATABASE_PROVIDER: InMemory
      RACEDAY_MEDIA_PROVIDER: Local
      RaceDay__InMemoryDatabaseName: RaceDayDocker
      RaceDay__Media__LocalPath: /app/App_Data/media
    volumes:
      - raceday-media:/app/App_Data/media
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Part 3/RaceDay.Mvc/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      RaceDay__ApiBaseUrl: http://api:8080/
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  raceday-media:
