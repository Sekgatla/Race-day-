name: Part 3 MVC, API, and Docker

on:
  push:
    branches: [main, part-3]
    paths:
      - "Part 2/**"
      - "Part 3/**"
      - "artifacts/raceday/.replit-artifact/artifact.toml"
      - ".github/workflows/part3-ci.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "Part 2/**"
      - "Part 3/**"
      - "artifacts/raceday/.replit-artifact/artifact.toml"
      - ".github/workflows/part3-ci.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  build-test-and-containerize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "Part 2/RaceDay.sln"

      - name: Build API and MVC application
        run: dotnet build "Part 2/RaceDay.sln" --configuration Release --no-restore

      - name: Run API integration tests
        run: dotnet test "Part 2/RaceDay.sln" --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build and smoke-test Docker Compose stack
        run: |
          set -euo pipefail
          docker compose up --build --detach

          for attempt in $(seq 1 45); do
            page="$(curl --silent --show-error --fail --connect-timeout 2 --max-time 5 http://localhost:8080/ 2>/dev/null || true)"
            if [[ -n "$page" ]] &&
               grep -q "Upcoming events" <<< "$page" &&
               ! grep -q "The event list will appear when the RaceDay API is available." <<< "$page"; then
              echo "The MVC home page loaded and its API-backed event request succeeded."
              exit 0
            fi
            echo "Waiting for the MVC site and API to become ready ($attempt/45)..."
            sleep 2
          done

          echo "Docker Compose did not become ready within 90 seconds."
          exit 1

      - name: Show Docker Compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans || true
