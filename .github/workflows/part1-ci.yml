name: Part 1 Documentation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: test -d docs

      - name: Check ERD
        run: test -s docs/RaceDay_ERD.pdf

      - name: Check API Endpoint Plan
        run: test -s docs/RaceDay_API_Endpoint_Plan.md

      - name: Check SQL Script
        run: test -s docs/RaceDay_Database.sql

      - name: Check README
        run: test -s README.md
